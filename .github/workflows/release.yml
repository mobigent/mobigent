name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift package
        working-directory: packages/ios
        run: swift test

  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify Android library
        run: gradle -p packages/android test

  publish:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - name: Publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npmjs.com publish."
            exit 0
          fi
          npm publish --workspace @mobigent/core --access public --provenance
          npm publish --workspace @mobigent/providers --access public --provenance
          npm publish --workspace @mobigent/react-native --access public --provenance
          npm publish --workspace @mobigent/gateway --access public --provenance

  publish-github-packages:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@mobigent"
      - run: npm ci
      - run: npm run build:sdk
      - name: Publish GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm publish --workspace @mobigent/core --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/providers --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/react-native --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/gateway --registry=https://npm.pkg.github.com

  github-release:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:sdk
      - name: Pack npm artifacts
        run: |
          mkdir -p release-artifacts
          npm pack --workspace @mobigent/core --pack-destination release-artifacts
          npm pack --workspace @mobigent/providers --pack-destination release-artifacts
          npm pack --workspace @mobigent/react-native --pack-destination release-artifacts
          npm pack --workspace @mobigent/gateway --pack-destination release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mobigent $GITHUB_REF_NAME" \
            --notes "First public Mobigent SDK release with React Native, native iOS, native Android, gateway, provider helpers, inspector, schema adapters, and security tooling."

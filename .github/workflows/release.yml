name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift package
        working-directory: packages/ios
        run: swift test

  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify Android library
        run: gradle -p packages/android test

  publish:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - name: Publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @mobigent/core --access public --provenance
          npm publish --workspace @mobigent/providers --access public --provenance
          npm publish --workspace @mobigent/react-native --access public --provenance
          npm publish --workspace @mobigent/gateway --access public --provenance

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Verify Swift package
        working-directory: packages/ios
        run: swift test

  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify Android library
        run: gradle -p packages/android test

  publish:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.10.0
      - name: Require npmjs publishing credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$NPM_TRUSTED_PUBLISHING" != "true" ]; then
            echo "npmjs.com publishing is not configured."
            echo "Set NPM_TOKEN, or configure npm Trusted Publishing and set repository variable NPM_TRUSTED_PUBLISHING=true."
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: Publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: npm run npm:publish
      - name: Verify npmjs package visibility
        run: npm run npm:status

  publish-github-packages:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@mobigent"
      - run: npm ci
      - run: npm run build:sdk
      - name: Publish GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm publish --workspace @mobigent/core --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/providers --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/backend --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/react-native --registry=https://npm.pkg.github.com
          npm publish --workspace @mobigent/gateway --registry=https://npm.pkg.github.com
          echo "Skipping create-mobigent-app for GitHub Packages because npm packages there must be scoped."

  github-release:
    needs: [validate-ios, validate-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:sdk
      - name: Pack npm artifacts
        run: |
          mkdir -p release-artifacts
          npm pack --workspace @mobigent/core --pack-destination release-artifacts
          npm pack --workspace @mobigent/providers --pack-destination release-artifacts
          npm pack --workspace @mobigent/backend --pack-destination release-artifacts
          npm pack --workspace @mobigent/react-native --pack-destination release-artifacts
          npm pack --workspace @mobigent/gateway --pack-destination release-artifacts
          npm pack --workspace create-mobigent-app --pack-destination release-artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mobigent $GITHUB_REF_NAME" \
            --notes "Mobigent SDK release with React Native, native iOS, native Android, gateway, provider helpers, inspector, schema adapters, security tooling, and create-mobigent-app starter."

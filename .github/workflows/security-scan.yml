name: Security Scan

on:
  schedule:
    - cron: '0 9 * * 3' # Weekly on Wednesday at 9am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-scan:
    name: Docker image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mobigent-gateway:local .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mobigent-gateway:local
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate SBOM with CycloneDX
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file mobigent-sbom.json --spec-version 1.5
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: mobigent-sbom.json
          retention-days: 90
